# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: tantu

before:
  hooks:
    - go mod tidy

builds:
  - id: tantu
    main: ./cmd/tantu
    binary: tantu
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X github.com/bhaskarjha-dev/tantu/internal/hub.HubVersion={{.Version}}

archives:
  - id: tantu-archive
    # `formats` (plural), not `format`: the singular property is deprecated in
    # GoReleaser v2 and `goreleaser check` exits non-zero on it. The release
    # workflow would keep building, but the config would stop validating the
    # moment the property is removed.
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"

# SBOM generation needs no secrets and ships with every release artifact,
# so auditors can verify the (tiny) dependency surface. Artifact signing
# (cosign) is deliberately NOT configured here: it requires key material
# that must never live in the repo; see docs/RELEASE.md.
sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
