# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: tantu

before:
  hooks:
    - go mod tidy

builds:
  - id: tantu
    main: ./cmd/tantu
    binary: tantu
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X github.com/bhaskarjha-dev/tantu/internal/hub.HubVersion={{.Version}}

archives:
  - id: tantu-archive
    # `formats` (plural), not `format`: the singular property is deprecated in
    # GoReleaser v2 and `goreleaser check` exits non-zero on it. The release
    # workflow would keep building, but the config would stop validating the
    # moment the property is removed.
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"

# SBOM generation needs no secrets and ships with every release artifact,
# so auditors can verify the (tiny) dependency surface.
sboms:
  - artifacts: archive

# Keyless signing. Every archive, its SBOM, and the checksum file get a
# detached signature plus the Fulcio certificate that vouches for the
# signing identity, so a downloader can prove an artifact came from this
# repository's release workflow without trusting the file it just fetched.
#
# Keyless is the only acceptable mode here, and the reason is a rule rather
# than a preference: a signing key must never live in this repository, and a
# keyless signature leaves nothing behind to leak. The trade is that the
# signature is only as good as the workflow's OIDC identity, which is why the
# workflow grants `id-token: write` and nothing else, and why verification
# pins the expected issuer and repository below rather than accepting any
# certificate that happens to validate.
signs:
  - id: cosign
    cmd: cosign
    certificate: '${artifact}.pem'
    signature: '${artifact}.sig'
    args:
      - sign-blob
      - '--yes'
      - '--output-signature=${signature}'
      - '--output-certificate=${certificate}'
      - '${artifact}'
    # "all" covers archives, the checksum file and the SBOMs. An SBOM is what
    # an auditor reads, so leaving it unsigned while signing the binary it
    # describes would be signed-adjacent evidence about unsigned software.
    artifacts: all


changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
