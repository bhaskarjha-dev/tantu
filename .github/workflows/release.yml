name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Keyless signing needs an OIDC identity, and nothing else here does. This is
  # the narrowest grant that makes the signature meaningful: it proves *which
  # workflow in which repository* signed the artifact, so it is worth granting
  # deliberately rather than by broadening `contents`.
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Kept in lockstep with .github/workflows/ci.yml. Go 1.26.3 was
          # replaced because govulncheck reported 9 reachable stdlib
          # vulnerabilities in it; see the comment on the quality job's pin.
          go-version: '1.27.1'
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Test release toolchain
        run: go test -count=1 ./...

      - name: Install syft (pinned)
        # GoReleaser's `sboms` step shells out to syft; without it a tag push
        # builds and archives everything and then fails with
        # `exec: "syft": executable file not found` - verified locally on
        # 2026-09-30 with the pinned GoReleaser. Pinned and checksum-verified
        # like every other tool in this pipeline: this step downloads and
        # executes code from outside go.mod's pinned surface, so it gets the
        # same treatment a release artifact would.
        env:
          SYFT_VERSION: 1.52.0
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          base="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          asset="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "${work}/${asset}" "${base}/${asset}"
          curl -sSfL --retry 3 -o "${work}/checksums.txt" "${base}/syft_${SYFT_VERSION}_checksums.txt"
          grep " ${asset}\$" "${work}/checksums.txt" > "${work}/expected"
          (cd "${work}" && sha256sum -c expected)
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "${work}/${asset}" -C "${HOME}/.local/bin" syft
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/syft" version

      - name: Install cosign (pinned)
        # GoReleaser's `signs` step shells out to cosign for the same reason
        # syft is needed for SBOMs: without it the release builds, archives,
        # catalogues and checksums everything and *then* fails.
        #
        # The pin is on the 2.x line and the reason is measured, not
        # preference: cosign 3.x deprecates `--output-signature` and
        # `--output-certificate` for keyless signing in favour of a single
        # `.bundle` file, and GoReleaser's `signs` integration expects the two
        # separate outputs. Verified locally on 2026-10-05 against cosign
        # 3.0.4, which printed
        #   "WARNING: --output-signature is deprecated ... and will be ignored"
        # and wrote no file at the requested path. `goreleaser check` passes on
        # that configuration, so reading the config would not have found it.
        #
        # Checksum-verified like syft: this step also downloads and executes
        # code from outside go.mod's pinned surface.
        env:
          COSIGN_VERSION: 2.6.1
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          base="https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}"
          asset="cosign-linux-amd64"
          curl -sSfL --retry 3 -o "${work}/cosign" "${base}/${asset}"
          curl -sSfL --retry 3 -o "${work}/checksums.txt" "${base}/cosign_checksums.txt"
          grep " ${asset}\$" "${work}/checksums.txt" > "${work}/expected"
          (cd "${work}" && sed "s| ${asset}\$| cosign|" expected | sha256sum -c -)
          install -m 0755 "${work}/cosign" "${HOME}/.local/bin/cosign"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          cosign version

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Every published artifact has a signature
        # GoReleaser reports success even when an individual signature fails in
        # some configurations, and "the release looks signed" is exactly the
        # claim this step exists to make false when it is not true. It counts
        # rather than trusting the publisher: every archive, every SBOM and the
        # checksum file must have both a .sig and a .pem beside it.
        run: |
          set -euo pipefail
          missing=0
          total=0
          for artifact in dist/*.tar.gz dist/*.zip dist/*.sbom.json dist/checksums.txt; do
            [ -e "$artifact" ] || continue
            total=$((total + 1))
            for suffix in .sig .pem; do
              if [ ! -s "${artifact}${suffix}" ]; then
                echo "::error::missing signature file ${artifact}${suffix}"
                missing=$((missing + 1))
              fi
            done
          done
          echo "checked ${total} artifact(s)"
          if [ "$total" -eq 0 ]; then
            echo "::error::no artifacts found to check; the release produced nothing"
            exit 1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::${missing} signature file(s) missing"
            exit 1
          fi
