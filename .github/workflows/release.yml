name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Kept in lockstep with .github/workflows/ci.yml. Go 1.26.3 was
          # replaced because govulncheck reported 9 reachable stdlib
          # vulnerabilities in it; see the comment on the quality job's pin.
          go-version: '1.27.1'
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Test release toolchain
        run: go test -count=1 ./...

      - name: Install syft (pinned)
        # GoReleaser's `sboms` step shells out to syft; without it a tag push
        # builds and archives everything and then fails with
        # `exec: "syft": executable file not found` - verified locally on
        # 2026-09-30 with the pinned GoReleaser. Pinned and checksum-verified
        # like every other tool in this pipeline: this step downloads and
        # executes code from outside go.mod's pinned surface, so it gets the
        # same treatment a release artifact would.
        env:
          SYFT_VERSION: 1.52.0
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          base="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          asset="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "${work}/${asset}" "${base}/${asset}"
          curl -sSfL --retry 3 -o "${work}/checksums.txt" "${base}/syft_${SYFT_VERSION}_checksums.txt"
          grep " ${asset}\$" "${work}/checksums.txt" > "${work}/expected"
          (cd "${work}" && sha256sum -c expected)
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "${work}/${asset}" -C "${HOME}/.local/bin" syft
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/syft" version

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
