name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

# Action majors are current as of 2026-09-30. The previous pins
# (checkout@v4, setup-go@v5, setup-node@v4) run on Node 20, which GitHub has
# deprecated - every run reported it, and the runtime underneath them is being
# removed.
#
# goreleaser-action is v7 in *this* file and deliberately stays at v6 in
# release.yml, and the split is not an inconsistency. The release-artifact job
# below runs on every push across three operating systems, so its goreleaser
# step is exercised continuously and a major bump proves itself the same day.
# The release workflow's does not run until a tag is pushed, and bumping a step
# that has never run is how a release pipeline gets discovered to be broken at
# release time. That reasoning was written when both were v6 and was applied to
# both; it only ever justified one of them. The warning it would have prevented
# was in fact being emitted on every push by the job it does not cover.
jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Pinned, but not to an arbitrary patch: govulncheck scans the
          # standard library this toolchain builds, so a toolchain behind on
          # security patches fails the quality gate even when the repository's
          # own code is clean. Go 1.26.3 reported 9 reachable stdlib
          # vulnerabilities (GO-2026-6218 through GO-2026-4970, fixed in
          # 1.26.4-1.26.6) and exited 3. Go 1.27.1 was clean until 2026-10-12,
          # when it reported 11 (GO-2026-6603, 6604, 6605, 6607, 6608, 6609,
          # 6610, 6611, 6612, 6613 and 6617, all fixed in 1.27.2): an HTTP/2 HPACK
          # encoder race that crashes a server, connection desynchronisation
          # after CONNECT, unbounded Range-header parsing, a MIME-header
          # memory-limit bypass reachable from ParseMultipartForm, and a Windows
          # os.Root junction escape in drop staging. Bump this the way the release
          # pin is bumped: deliberately, with a govulncheck run on the candidate
          # version recorded in the commit.
          #
          # Verified locally before bumping, in both directions, with GOTOOLCHAIN
          # pinned so each scan really used that toolchain:
          #   go1.27.1 -> Your code is affected by 11 vulnerabilities (exit 1)
          #   go1.27.2 -> No vulnerabilities found (exit 0)
          go-version: '1.27.2'
          cache: true

      - name: gofmt
        # A format gate is only trustworthy because .gitattributes pins LF for
        # every text file, so a Windows checkout cannot report false positives.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run: gofmt -w <files>"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        # Catches unreachable code, unused results, and error-handling mistakes
        # that the compiler and vet do not. The version is pinned because an
        # unpinned one silently rots: a staticcheck that cannot read the
        # toolchain's export data fails on every package with an internal
        # error, which looks like a lint failure rather than a broken tool.
        # The previous pin (2025.1.1) had exactly that problem against Go
        # 1.27. Checks that are deliberately off are recorded in
        # staticcheck.conf with the reason.
        run: |
            # v0.8.2, not v0.8.1: v0.8.1 cannot read Go 1.27.2's export data ("export
            # data version 5 is greater than maximum supported version 4") and the toolchain bump above
            # made the gate fail on a tool error rather than on a finding. Verified under
            # GOTOOLCHAIN=go1.27.2 that v0.8.2 exits 0 on this tree, and that it still reports a
            # planted violation rather than silently passing.
            go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: govulncheck
        # Reports vulnerabilities reachable from this module's own code, which
        # is far more actionable than an unscanned dependency list.
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Line endings
        # .gitattributes normalizes text to LF; a CRLF committed into the
        # repository produces noisy diffs and false gofmt failures.
        run: |
          if git grep -Il $'\r' -- '*.go' '*.md' '*.yml' '*.yaml'; then
            echo "::error::CRLF line endings committed; run 'git add --renormalize .'"
            exit 1
          fi

      - name: Workflow shell parses
        # release.yml has never executed: it runs for the first time on a tag
        # push, and nothing in CI inspected it, so a shell error in its signing
        # step would be found at the moment of release. The CI workflow itself
        # grew five shell steps recently and every one of them was found broken
        # by a real runner rather than by a check.
        #
        # bash -n parses without executing, which is the only safe thing to do
        # with steps that install binaries, push tags and sign artifacts.
        #
        # wfcheck exits non-zero when bash is absent rather than reporting a pass
        # it did not earn.
        run: go run ./tools/wfcheck

      - name: UTF-8 encoding
        # A CP1252 round trip once re-encoded source and documentation into
        # still-valid UTF-8 that compiled, tested green, and read as plausible
        # mojibake across nine commits. Nothing in the toolchain notices: the
        # damage lands in log-message emoji, comments and prose, where the
        # compiler has no opinion. This gate checks for it, and the C1 control
        # check inside it is what catches damage that has no mojibake signature
        # at all - which is how docs/ARCHITECTURE.md was missed.
        run: go run ./tools/encgate

      - name: Documentation claims match the code
        # The register's own gap 5.5: three separate false claims shipped in one
        # session, each a *stated* property with nothing checking it. This checks
        # the class that is mechanically decidable - the CLI surface in both
        # directions, the flags the docs tell a user to type, the limits, the
        # ports, the config directory and the environment variables - and refuses
        # to report success if its own inputs are missing or unparseable.
        #
        # It is only trustworthy because it is itself tested against
        # deliberately broken input (tools/docgate/main_test.go), which is the
        # lesson from the encoding gate that could not detect its own damage.
        run: go run ./tools/docgate

  fuzz:
    name: Fuzz (wire and validation parsers)
    # The four fuzz targets that already existed were never actually fuzzed.
    # `go test` runs a fuzz target's seed corpus and stops; `go test -fuzz`
    # is what generates inputs. Every job in this workflow runs the former, so
    # the latter had never executed once. All four parse input that arrives
    # from another machine -- the wire envelope, the OAuth callback relay, the
    # discovery beacon and the drop metadata -- which is exactly where a
    # hand-written table stops helping. Their seed corpora are small (1, 3, 1
    # and 4 entries), which is what makes running them so cheap.
    #
    # A separate job rather than a step in Quality gates: it costs minutes,
    # and Quality gates is the job everyone waits on and is deliberately fast.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true

      - name: Fuzz each target for 30s
        # A loop, because Go refuses -fuzz with more than one package and
        # more than one target at a time. Both limits found by running this
        # rather than reading about them: `go test ./... -fuzz=...` exits 1
        # with "cannot use -fuzz flag with multiple packages".
        #
        # The execs floor is the part that matters. A target that matched
        # nothing, or terminated immediately, still exits 0 and would report
        # success having fuzzed nothing -- the same failure shape as the
        # encoding gate that could not detect its own damage. So this greps the
        # output rather than trusting the exit code.
        #
        # This is not theoretical. The first run of this job failed on its own
        # floor, because FuzzValidateDropMetadata was pointed at
        # ./internal/hub/ when it lives in ./internal/drop/. Go did not complain:
        # a package with no such target exits 0 and prints PASS, having fuzzed
        # nothing. Without the floor that run would have been green and the gate
        # would have been decorative for as long as the mistake survived.
        # Baselines measured 2026-10-13: FuzzDecode 1,021,828 execs in 32s, the
        # other three 250,000 to 300,000 in 15-30s. The floor is well below the
        # slowest, so it cannot flake.
        #
        # FuzzCallbackExpectation joined on 2026-10-17 and measured 607,973 execs
        # in 90s locally, so it clears the floor comfortably. It is a target
        # rather than only a table because the Kiro defect was a *rule* -- "the
        # catcher must never require anything the authorization URL did not state"
        # -- and a table can only hold the shapes somebody thought of. Both of its
        # breaks are red on the seed corpus alone, with no generation at all.
        run: |
          status=0
          for spec in "./internal/protocol/:FuzzDecode" \
                      "./internal/bridge/:FuzzValidateCallbackRelay" \
                      "./internal/bridge/:FuzzCallbackExpectation" \
                      "./internal/discovery/:FuzzValidBeacon" \
                      "./internal/drop/:FuzzValidateDropMetadata"; do
            pkg="${spec%%:*}"
            target="${spec##*:}"
            echo "::group::fuzz $target"
            log=$(mktemp)
            # -run=NONE skips the seed-only pass so the whole budget goes to
            # generated inputs. Anything Go writes to testdata/fuzz/<target>
            # is a reproducer and is meant to be committed, not deleted.
            go test "$pkg" -run=NONE -fuzz="$target" -fuzztime=30s -parallel=2 >"$log" 2>&1
            run_status=$?
            tail -n 12 "$log"
            execs=$(grep -o 'execs: [0-9]*' "$log" | tail -n 1 | grep -o '[0-9]*')
            if [ -z "$execs" ] || [ "$execs" -lt 100000 ]; then
              printf '::error::%s reported %s executions, expected at least 100000. A fuzz gate that ran nothing is worse than no gate, because it is green.\n' "$target" "${execs:-none}"
              status=1
            fi
            if [ "$run_status" -ne 0 ]; then
              printf '::error::%s found a failure. Reproducers are written to testdata/fuzz/%s/ -- commit them, they are the regression test.\n' "$target" "$target"
              status="$run_status"
            fi
            rm -f "$log"
            echo "::endgroup::"
          done
          exit "$status"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Must match the quality job: stdlib findings are judged against
          # this version, and a mismatch would test a different runtime than
          # the one the gate scans.
          go-version: '1.27.2'
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Module files are tidy
        # The release pipeline runs `go mod tidy` as a before-hook, which
        # would rewrite go.mod/go.sum during a tag build if the tagged commit
        # were not tidy - releasing code that differs from the tag. Tidiness
        # belongs to the commit, so it is checked here rather than being
        # repaired at release time. Linux only: tidiness is platform-
        # independent, and a Windows checkout's line endings would make
        # `git diff` of go.mod disagree with itself.
        if: matrix.os == 'ubuntu-latest'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        if: matrix.os != 'windows-latest'
        shell: bash
        # A job's raw log needs admin rights to read, so outside this
        # repository a red run is only an exit code. The failure is therefore
        # re-emitted as annotations, which the public API exposes: which test
        # failed, and the detail beneath it. An unexplained red run is the
        # thing that let fourteen consecutive failures go unnoticed.
        run: |
          # See the dashboard-acceptance step for why this is not optional: a
          # pipeline's exit status is that of its last command, so without
          # pipefail `... | tee log || status=$?` records tee's status, always 0,
          # and this job would report success for a red test run.
          set -o pipefail

          status=0
          go test -count=1 -race ./... 2>&1 | tee test-output.log || status=$?
          if [ "$status" -ne 0 ]; then
            # `|| true` because this shell runs with -o pipefail: a run that
            # failed without a `--- FAIL` line (a build error, say) would
            # otherwise abort here and drop the detail annotation below.
            (grep -E -- '--- FAIL' test-output.log || true) | sort -u | head -20 \
              | while IFS= read -r line; do
                  printf '::error title=failed test::%s\n' "$line"
                done
            detail=$(tail -n 60 test-output.log)
            printf '::error::%s\n' "${detail//$'\n'/%0A}"
          fi
          exit "$status"

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        # The same annotation re-emission as the Test step above, which this one
        # lacked entirely. Without it a red Windows run reported only "Process
        # completed with exit code 1" -- which is what happened on 2026-10-07 to
        # a `-count=2` failure that could not be reproduced locally in six full
        # runs. A failure you cannot name is a failure you cannot act on, and the
        # whole point of the annotations is that the public API exposes them.
        #
        # `shell: bash` is required for that re-emission, since it uses pipes,
        # `while read`, and parameter expansion that PowerShell does not share.
        run: |
          # Same reason as the -race step above: without pipefail this captures
          # tee's status and the job reports success for a red test run.
          set -o pipefail

          status=0
          go test -count=2 ./... 2>&1 | tee test-output.log || status=$?
          if [ "$status" -ne 0 ]; then
            (grep -E -- '--- FAIL' test-output.log || true) | sort -u | head -20 \
              | while IFS= read -r line; do
                  printf '::error title=failed test::%s\n' "$line"
                done
            detail=$(tail -n 60 test-output.log)
            printf '::error::%s\n' "${detail//$'\n'/%0A}"
          fi
          exit "$status"

      - name: Coverage floor
        if: matrix.os == 'ubuntu-latest'
        # The CLI is the surface every user touches and was the thinnest covered
        # package, so it carries an explicit floor. A regression below this line
        # means user-facing behaviour lost its tests.
        #
        # The floor is deliberately just below the current value so it is a
        # genuine regression guard rather than an aspirational number. Ratchet it
        # up as command runners become testable (they call os.Exit today, which
        # is the main reason this package sits near 19%).
        run: |
          go test -count=1 -coverprofile=coverage.out -coverpkg=./cmd/tantu/... ./cmd/tantu/... >/dev/null
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          echo "cmd/tantu coverage: ${total}"
          floor=18
          actual=$(echo "$total" | tr -d '%' | awk '{print int($1)}')
          if [ "$actual" -lt "$floor" ]; then
            echo "::error::cmd/tantu coverage ${actual}% is below the ${floor}% floor"
            exit 1
          fi

  dashboard-acceptance-engines:
    name: Dashboard acceptance (browser engine)
    # One runner per engine, and the reason is a measurement rather than a
    # preference.
    #
    # The job used to run all seven browser sessions -- three engines, two
    # topologies, and the two-hub pass -- on one runner, in one job. The
    # session that failed on 2026-10-20 was the sixth: the webkit peers run,
    # which reported "WebKit encountered an internal error" against every
    # endpoint it touched, including the page's own URL, and failed again when
    # the job re-ran that case with a FRESH BROWSER on the SAME runner. A fresh
    # browser not helping is the measurement that matters: the degradation is
    # in the runner, not in the browser process, so the remedy is a fresh
    # runner rather than a fresh browser.
    #
    # The local measurement agrees that the pressure is real. Seven consecutive
    # sessions were run in CI's exact order on one machine, and all seven
    # passed -- but the webkit ones took 153s and 156s against 86-95s for the
    # others. WebKit is the heavy engine, and it was the heavy engine that
    # failed.
    #
    # So each engine gets a runner that has never run a browser: three
    # runners, two sessions each, instead of one runner with seven. The cost
    # is runner minutes; the benefit is that the product's only browser
    # evidence does not depend on how many browsers came before it.
    #
    # fail-fast is off on purpose. Every engine runs even when an earlier one
    # fails, because "chromium failed, so firefox was never looked at" wastes
    # the only run you get.
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    # The Go suite cannot catch a blocked image, a focus-destroying poll, or
    # sub-AA contrast; tools/uxtest drives a real browser for those, and this
    # job is what makes that evidence mandatory rather than a local ritual.
    #
    # This job is the EVIDENCE. The check that the branch requires is the
    # aggregate below, named "Dashboard acceptance (browser)" -- because a
    # matrix appends its value to the check name, so a matrix here would
    # rename the required check to "Dashboard acceptance (browser engine)
    # (chromium)" and the binding would never be satisfied again. The DEV-RECORD
    # records that the name was kept for exactly that reason (Batch Z28), and
    # Batch Z119 is where a matrix nearly undid it.
    #
    # It is blocking as of 2026-09-30, when it had three consecutive green
    # runs (#22, #23, #24) on this runner. Until then it carried
    # `continue-on-error` because it had never once completed here - every
    # run since #6 died before its first check - and a gate that fails for
    # infrastructure reasons teaches people to ignore it. The finding it
    # exists to catch was never left unguarded: TestEveryDataActionHasAHandler
    # enforces the action-wiring half of the sweep on every push, and that
    # cannot vary by environment.
    #
    # As of 2026-10-02 the harness runs on Playwright and sweeps all three
    # engines (chromium, firefox, webkit) in this one gate: engine-specific
    # rendering bugs are exactly the class a single engine cannot see, and
    # webkit already earned its seat by surfacing the hidden-subtree theme
    # staleness the sweep now measures around.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true
      - name: Install Playwright and the three engines
        run: |
          cd tools/uxtest
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Self-check the harness's narrow-viewport gates
        # Two gates about gates, both about a defect that appears only on the
        # runners: 21px of horizontal overflow at 360px in Firefox and WebKit,
        # caused by a button label that cannot wrap, on a font wider than any
        # developer's. Neither reproduces locally, which is exactly why they run
        # here.
        #
        # The first checks the harness's overflow diagnostic still detects and
        # names both box and text overflow, and ranks a real page-level overflow
        # above an element inside a scroll container -- the ranking that buried
        # the actual cause when it was first found.
        #
        # The second reproduces the font condition deliberately and asserts the
        # document does not overflow at 320px or 360px with it. Against the code
        # as it stood before the fix it reports the document at 413 wide in a 360
        # viewport.
        run: |
          set -o pipefail
          node tools/uxtest/selfcheck-overflow-probe.cjs
          node tools/uxtest/selfcheck-narrow-viewport-button.cjs
          # Third gate about a gate: the engine-failure detector. It exists because
          # on 2026-10-16 a webkit run reported six failures when one engine-level
          # request failure caused five of them, and nothing said so. A detector
          # that cannot be tested is a detector that quietly stops matching, and
          # then the run goes back to reporting every consequence separately.
          node tools/uxtest/selfcheck-engine-failure.cjs
          # Fourth gate about a gate: the boot-settled condition. The harness
          # waited for "the fragment is gone", on a comment claiming that meant
          # the page had finished booting. dashboard.html strips the fragment and
          # only then reloads, so the condition was true one step early, and a
          # read landing in that window blamed the Hub for a harness race. It
          # never reproduced locally because the reload outran the 250ms poll;
          # this gate reproduces the window deliberately.
          node tools/uxtest/selfcheck-settle.cjs
      - name: Run acceptance harness across engines
        # One runner per engine, and the reason is a measurement rather than a
        # preference.
        #
        # The job used to run all seven browser sessions -- three engines, two
        # topologies, and the two-hub pass -- on one runner, in one job. The
        # session that failed on 2026-10-20 was the sixth: the webkit peers
        # run, which reported "WebKit encountered an internal error" against
        # every endpoint it touched, including the page's own URL, and failed
        # again when the job re-ran that case with a FRESH BROWSER on the SAME
        # runner. A fresh browser not helping is the measurement that matters:
        # the degradation is in the runner, not in the browser process, so the
        # remedy is a fresh runner rather than a fresh browser.
        #
        # The local measurement agrees that the pressure is real. Seven
        # consecutive sessions were run in CI's exact order on one machine, and
        # all seven passed -- but the webkit ones took 153s and 156s against
        # 86-95s for the others. WebKit is the heavy engine, and it was the
        # heavy engine that failed.
        #
        # So each engine gets a runner that has never run a browser: three
        # runners, two sessions each, instead of one runner with seven. The
        # cost is runner minutes; the benefit is that the product's only
        # browser evidence does not depend on how many browsers came before it.
        #
        # The matrix itself is on the JOB, not on this step, and the job is
        # the one named "Dashboard acceptance (browser engine)" -- the required
        # check keeps the name without a matrix suffix because the aggregate
        # job below carries it.
        #
        # Same reasoning as the test step: the harness's diagnostics are the
        # only diagnosis available for this job, and a log nobody can read
        # turns "exit 3" into a mystery. Every run executes even when an
        # earlier one fails -- one gate, two runs per leg, one annotation each --
        # because "chromium failed, so firefox was never looked at" wastes
        # the only run you get.
        #
        # Both topologies per engine since Batch Z31: peerless is the default
        # rig, while --peers seeds three trusted peers so the multi-peer
        # layout (destination pills, per-peer send preview, populated store)
        # is exercised on every push. The pair was validated locally in
        # Batch Z28; without this loop a peerless-only CI could never notice
        # a regression that only appears once peers are listed.
        run: |
          # pipefail, and this is not a stylistic choice.
          #
          # Every harness invocation below is `node ... | tee log`. Without
          # pipefail a pipeline's status is the status of its *last* command, so
          # `$?` after the failure branch is tee's -- always 0. Verified by
          # running the same construct through a child that exits 1, 4 and 0:
          # without pipefail all three reported run_status=0; with it, 1, 4 and 0.
          #
          # The consequence was that this job could not fail on a harness
          # regression at all. Every case arm below -- the "Hub died mid-run"
          # arm and the general failure arm -- was unreachable, while the job
          # stayed green. It did in fact stay green through a period when the
          # harness was throwing a ReferenceError on every single run and
          # exiting 1: 113 of 114 checks passing, reported as success.
          #
          # This is the same failure class as a watcher nobody calls or a
          # document nobody verifies. A gate that cannot fail is not a gate, and
          # the 114 checks in this job are the product's only browser evidence.
          set -o pipefail

          status=0
          infra=0
          engine="${{ matrix.engine }}"
          # Screenshots are written here rather than into the harness work
          # directory, which is deleted when a run passes. Uploaded below on
          # every run, green or red.
          SHOTDIR="$RUNNER_TEMP/uxtest-shots"
          mkdir -p "$SHOTDIR"
          for mode in "" "--peers"; do
            label="$engine${mode:+ peers}"
            slug="$engine${mode:+-peers}"
            echo "::group::dashboard-acceptance $label"
            # --- BEGIN dashboard-acceptance case ---
            run_status=0
            TANTU_TEST_SHOTDIR="$SHOTDIR" node tools/uxtest/run.mjs --browser="$engine" $mode 2>&1 | tee "harness-$slug.log" || run_status=$?
            if [ "$run_status" -eq 5 ]; then
              # Exit 5 is the harness saying the BROWSER failed, not the
              # product: the engine reported an internal error and the checks
              # that failed are attributed to it. This is a known WebKit fault,
              # not a Tantu defect -- see docs/KNOWN-LIMITATIONS.md row 2.9.
              #
              # Re-run this one case once. An engine fault does not reproduce;
              # a product defect does, and the second attempt is what tells
              # them apart. The first attempt's output is printed either way,
              # so a product-shaped failure hiding behind an engine fault is
              # visible rather than swallowed.
              printf '::warning::dashboard-acceptance (%s) was NOT A PRODUCT RESULT: the browser engine failed a request. Re-running this case once.\n' "$label"
              first_detail=$(tail -n 40 "harness-$slug.log")
              printf '::warning::dashboard-acceptance (%s) first attempt: %s\n' "$label" "${first_detail//$'\n'/%0A}"
              run_status=0
              TANTU_TEST_SHOTDIR="$SHOTDIR" node tools/uxtest/run.mjs --browser="$engine" $mode 2>&1 | tee "harness-$slug-retry.log" || run_status=$?
              if [ "$run_status" -eq 0 ]; then
                printf '::warning::dashboard-acceptance (%s) passed on the retry, so the first attempt was a browser engine fault rather than a Tantu defect.\n' "$label"
              fi
            fi
            # The runs on this leg share one directory, so a run that produced no images
            # is worth saying out loud rather than passing as an empty folder.
            #
            # The test is the number of images, not the existence of the
            # directory. The harness creates that directory before it runs a
            # single check, so the old `[ ! -d ... ]` could never fire, and
            # it would not have detected a run that rendered nothing either,
            # since it tested existence rather than contents.
            #
            # After the retry, so it describes the attempt that counted.
            shots=$(find "$SHOTDIR/$slug" -maxdepth 1 -name '*.png' 2>/dev/null | wc -l)
            if [ "$shots" -eq 0 ]; then
              printf '::warning::dashboard-acceptance (%s) produced no screenshots at %s\n' "$label" "$SHOTDIR/$slug"
            fi
            # Exit 4 is the harness telling us its Hub died mid-run, which is
            # not a product result: every later check failed for want of a
            # server. Reporting it in the same bucket as a real regression
            # would train everyone to ignore the job, so it is surfaced as a
            # distinct warning while still failing the run.
            case "$run_status" in
              4)
                infra=1
                # status is set too, deliberately. An earlier version only set
                # `infra`, and `exit "$status"` then reported success for a
                # run in which the Hub under test died -- a false green, which
                # is the exact failure this classification exists to prevent.
                # Verified by simulating exit 0, 1 and 4 through the same
                # case statement: 4 must not exit 0.
                [ "$status" -eq 0 ] && status=4
                detail=$(tail -n 40 "harness-$slug.log")
                printf '::warning::dashboard-acceptance (%s) was NOT A PRODUCT RESULT: %s\n' "$label" "${detail//$'\n'/%0A}"
                printf '::error::dashboard-acceptance (%s): the Hub under test exited mid-run (exit 4). This run proves nothing either way - re-run.\n' "$label"
                ;;
              5)
                # Still the engine after the retry. That is no longer an
                # intermittent browser fault, so it is a failure -- and it
                # names the cause rather than leaving it to be guessed.
                status=5
                detail=$(tail -n 40 "harness-$slug-retry.log" 2>/dev/null || tail -n 40 "harness-$slug.log")
                printf '::error::dashboard-acceptance (%s) failed again with the browser engine at fault: %s\n' "$label" "${detail//$'\n'/%0A}"
                ;;
              0) ;;
              *)
                status="$run_status"
                detail=$(tail -n 60 "harness-$slug.log")
                printf '::error::dashboard-acceptance (%s) failed: %s\n' "$label" "${detail//$'\n'/%0A}"
                ;;
            esac
            # --- END dashboard-acceptance case ---
            echo "::endgroup::"
          done

          # Did any run end as "not a product result" rather than as a product
          # failure?
          #
          # The two need different words. One means the product is broken; the
          # other means this machine was. `infra` was assigned in two places
          # and read in neither, which is a marker of an intent that was never
          # wired -- so it is read now, and the job says which of the two
          # happened.
          if [ "$infra" -eq 1 ]; then
            printf '::warning::dashboard-acceptance: at least one run was NOT A PRODUCT RESULT (the Hub under test exited mid-run). Those runs prove nothing either way - re-run them.\n'
          fi

          # One extra pass, on one engine, and deliberately not six.
          #
          # This stands up a second and third Hub, pairs them through the
          # product's own CLI, and sends real bytes between them over real mTLS.
          # Everything else the harness does against a "peer" is either loopback
          # or the blackhole at 192.0.2.1 that never answers, so this is the only
          # place the browser ever drives a peer that exists.
          #
          # Once rather than per engine and topology because the signal is in the
          # wire and the flow, not in rendering: two extra Hubs and a real pairing
          # six times over would cost minutes per push to re-prove the same thing.
          # Rendering of the same screens on all three engines is still covered by
          # the ordinary pass above.
          #
          # Once per JOB rather than once per engine now that each engine has a
          # runner of its own: the chromium leg runs it, and the other two do
          # not. It was the same single run before the split, and it is the same
          # single run after.
          if [ "$engine" = "chromium" ]; then
            twohub_status=0
            echo "::group::dashboard-acceptance two-hub"
            TANTU_TEST_SHOTDIR="$SHOTDIR" node tools/uxtest/run.mjs --browser=chromium --peers --two-hub 2>&1 | tee harness-two-hub.log || twohub_status=$?
            if [ "$twohub_status" -ne 0 ]; then
              status="$twohub_status"
              printf '::error::dashboard-acceptance (two-hub) failed: %s\n' "$(tail -n 40 harness-two-hub.log)"
            fi
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Upload rendered screenshots
        # Every run of this job renders the dashboard several ways per engine
        # and topology. Until now none of it survived the run. Seventeen of
        # the eighteen UI defects found so far came from looking at the
        # running page rather than from reading code, and the first image
        # anyone actually opened here -- the 360px one, after suspending the
        # cleanup by hand -- showed a header three rows deep.
        #
        # `if: always()` because the failing run is the one whose pictures are
        # worth having, and the step above exits non-zero to report a failure.
        # Seven days: seven runs per push at four images each is neither large
        # nor worth keeping forever.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # One artifact per engine, because the job now runs once per engine
          # and two uploads with the same name fail the run.
          name: dashboard-screenshots-${{ matrix.engine }}
          path: ${{ runner.temp }}/uxtest-shots
          if-no-files-found: warn
          retention-days: 7

  dashboard-acceptance:
    name: Dashboard acceptance (browser)
    # The check the branch requires, and the only one with this name.
    #
    # The browser evidence is produced by the three engine legs above. A
    # matrix appends its value to a job's check name, so putting the matrix on
    # this job would have renamed the required check to "Dashboard acceptance
    # (browser engine) (chromium)" and the branch's binding -- which names
    # "Dashboard acceptance (browser)" -- would never be satisfied again. The
    # DEV-RECORD records that the name was preserved for exactly that reason
    # in Batch Z28; this job is what preserves it now that the matrix exists.
    #
    # So the aggregate carries the name and the legs carry the work.
    #
    # `if: always()` because the aggregate must RUN after a failed leg, not be
    # skipped by it: a skipped required check is not a red one, and the whole
    # point of this job is to turn a failed leg into a failed check. The step
    # below therefore reads the legs' result and decides for itself.
    needs: dashboard-acceptance-engines
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: The browser evidence
        run: |
          # The legs' result is the input, and the only input. A job that
          # needs a failed job is skipped by default, and a skipped required
          # check is not a failure -- so the decision is made here, explicitly,
          # rather than left to the scheduler.
          result="${{ needs.dashboard-acceptance-engines.result }}"
          echo "dashboard-acceptance (browser engine) result: $result"
          if [ "$result" != "success" ]; then
            printf '::error::the browser evidence did not pass: the engine legs reported %s\n' "$result"
            exit 1
          fi
          echo "all three engine legs passed"

  release-artifact:
    name: Release artifact (${{ matrix.goos }})
    # The one product promise no existing gate touches.
    #
    # Every other job runs `go build ./...` or `go test`, which compile from
    # source with the toolchain's own defaults. The file a user downloads is
    # neither: it is produced by .goreleaser.yaml, which sets CGO_ENABLED=0,
    # stamps the version through ldflags, and packs six archives. Until this
    # job, nothing in CI ever executed that path, so the header comment above
    # ("nothing exercises it until a tag is pushed") was accurate -- and the
    # consequences were: a typo in an ldflag would ship a binary reporting
    # "dev" while its own Hub reported a release; a dropped CGO_ENABLED=0 would
    # ship a binary needing glibc on a machine with no package manager, which
    # is the exact failure the product exists to avoid; a wrong `name_template`
    # would ship archives users cannot tell apart.
    #
    # Each matrix entry runs the archive built FOR that platform, so linux is
    # verified by running the linux binary on linux, not by checking that a file
    # exists. Cross-compiling proves it compiles; running it is the only thing
    # that proves it works on the machine it was built for.
    #
    # `--snapshot` because there is no tag on a pull request, and `--skip=sign`
    # because keyless signing needs the release workflow's OIDC identity, which
    # this job deliberately does not have. Signing is therefore still unverified
    # outside a real release; see docs/KNOWN-LIMITATIONS.md 3.18.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            runner: ubuntu-latest
            ext: ''
            archive_ext: '.tar.gz'
          - goos: darwin
            runner: macos-latest
            ext: ''
            archive_ext: '.tar.gz'
          - goos: windows
            runner: windows-latest
            ext: '.exe'
            archive_ext: '.zip'
    env:
      # Set explicitly rather than read from `go env`: the point of this job is
      # to know which platform's archive to run, and asking the toolchain would
      # make the archive under test a function of the toolchain rather than of
      # the matrix.
      GOOS: ${{ matrix.goos }}
      EXT: ${{ matrix.ext }}
      # The archive container suffix, as a second matrix fact rather than a
      # second `if [ "$RUNNER_OS" = ... ]` branch. An earlier version
      # special-cased Windows inline, which meant the platform name appeared in
      # two places that had to agree; a matrix entry adding a platform would
      # have needed both.
      ARCHIVE_EXT: ${{ matrix.archive_ext }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Deliberately the same toolchain the Test jobs use. A release built
          # with a different one would make "CI is green" and "the artifact is
          # sound" statements about different compilers.
          go-version: '1.27.2'
          cache: true
      - name: Warm the module cache
        # goreleaser's `before.hooks: go mod tidy` needs the module *zips*, and
        # the first run of this job died there on a transient proxy failure --
        # `read https://proxy.golang.org/.../v0.47.0.zip: stream error: stream ID
        # 1; INTERNAL_ERROR`. That is the network, not the product, and setup-go's
        # cache does not carry the zips because a linux `go test` never needs
        # them.
        #
        # Doing the fetch here rather than inside goreleaser's hook makes the
        # difference between "we depend on a network call mid-build" and "we
        # warmed a cache", and it puts the tidiness check where its output is
        # legible. The hook then has nothing to fetch and cannot flake.
        #
        # Retried because the only thing being retried is a network fetch, and
        # each attempt is reported. This is not a blanket retry: the loop still
        # fails the job if every attempt fails, and a genuine go.mod problem
        # fails on the first attempt and again on all three.
        #
        # No `set -e`: under `-e` the first failing iteration would abort the loop
        # before it could retry, which is the opposite of the intent here.
        shell: bash
        run: |
          set -uo pipefail
          ok=0
          for attempt in 1 2 3; do
            if go mod download all && go mod tidy; then
              ok=1
              break
            fi
            echo "::warning::module fetch attempt ${attempt}/3 failed; retrying"
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::could not fetch modules after 3 attempts"
            exit 1
          fi
          git diff --exit-code go.mod go.sum
      - name: Validate the release config
        # Not an assumption: the first run of this job failed on all three
        # platforms at `goreleaser release` with the command simply absent --
        # goreleaser is not preinstalled on any GitHub runner, and only the
        # release workflow installs it, on a tag.
        #
        # Pinned to the same v2.18.2 the release workflow uses, deliberately. CI
        # verifying the output of a different goreleaser version than the one
        # that ships releases would mean the gate and the product are built by
        # different tools, which is the same class of error as verifying a
        # different Go toolchain than the one that ships.
        #
        # `check` rather than a release: the action defaults to `release --clean`
        # when `args` is absent, which on a pull request would attempt an actual
        # release. It also gates the config on every push, so a deprecated
        # property fails here rather than at tag time -- which is the failure the
        # `formats:` comment in .goreleaser.yaml was written to prevent.
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.2
          args: check
      - name: Build every archive
        # The build runs *inside* the action rather than in a following shell
        # step. The previous version installed goreleaser with the action and
        # then invoked `goreleaser` from a later `run:` block, which depends on
        # the action having exported the binary onto PATH for subsequent steps.
        # It evidently does not: the second run passed this step's installer and
        # failed immediately after it, on every platform, with the binary not
        # resolvable. Rather than depend on a side effect of someone else's
        # action, each step now asks the action to do goreleaser's work.
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.2
          # --snapshot because there is no tag on a pull request; --skip=sign
          # because keyless signing needs the release workflow's OIDC identity,
          # which this job deliberately does not have (KNOWN-LIMITATIONS 3.18).
          args: release --snapshot --clean --skip=sign,sbom
      - name: Show what was built
        # A bare `ls` so the run log records the artifact names even when the
        # steps below pass. When this job failed twice without a readable log,
        # the absence of a filename listing is part of what made it hard to
        # diagnose.
        shell: bash
        run: ls -la dist/
      - name: Run this platform's archive exactly as a user would
        shell: bash
        run: |
          set -euo pipefail
          # The archive glob must select exactly one file, and `*_linux_*.tar.gz`
          # matches BOTH the amd64 and arm64 builds -- verified against a real
          # dist/ tree, where it matched 2 of 6 artifacts on every platform. A
          # matrix literal for the arch would fix that for today's runners and
          # break the day a new one appears, so this is derived at run time from
          # the Go toolchain, which is set up for the runner and therefore
          # cannot disagree with it.
          #
          # `runner.arch` would read better but is not available here: it is
          # step-scoped, and using it in this job's env block made GitHub reject
          # the whole workflow with "Unrecognized named-value: 'runner'", so the
          # job never started. That failure cost a push and is the reason this
          # is a shell expansion rather than an expression.
          GOARCH=$(go env GOARCH)
          echo "selecting the $GOOS/$GOARCH archive"
          pattern="*_${GOOS}_${GOARCH}*${ARCHIVE_EXT}"
          # Exactly one archive must match, and it must be named for the
          # platform under test. `ls | head -1` would quietly take whichever
          # sorted first, so a change to name_template that made the names
          # ambiguous -- or a leftover file from an earlier run -- would let the
          # job unpack the wrong binary and report on it as if it were right.
          # That is the failure mode a gate has most to avoid: it would pass
          # having verified nothing about this platform.
          matches=$(find dist -maxdepth 1 -name "$pattern" | sort)
          count=$(printf '%s\n' "$matches" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly 1 archive matching '$pattern', found $count:"
            printf '%s\n' "$matches"
            ls -la dist/ || true
            exit 1
          fi
          archive="$matches"
          echo "::group::unpacking $(basename "$archive")"
          mkdir -p unpacked
          case "$archive" in
            *.zip) unzip -q "$archive" -d unpacked ;;
            *)     tar xzf "$archive" -C unpacked ;;
          esac
          ls -la unpacked/
          echo "::endgroup::"
          bin="unpacked/tantu${EXT}"
          test -x "$bin" || test -f "$bin"
          # --version proves three things at once: the binary loads, the ldflags
          # reached it, and it runs on the OS it was packaged for. A binary that
          # reports its version wrong has an ldflag path problem, which is
          # exactly the class of defect this job exists to catch.
          echo "::group::$bin --version"
          "$bin" --version
          echo "::endgroup::"
          version=$("$bin" --version)
          case "$version" in
            *SNAPSHOT*) echo "version reports the snapshot build: $version" ;;
            *) echo "::error::version does not carry the build stamp: '$version'. The ldflags path in .goreleaser.yaml is not reaching the binary."; exit 1 ;;
          esac
          # doctor is the one read-only command that touches config, identity
          # and the peer store, so it exercises the parts of a fresh machine's
          # first run that --version cannot.
          echo "::group::$bin doctor"
          "$bin" doctor || true
          echo "::endgroup::"
      - name: The archive must not need a runtime the machine may lack
        shell: bash
        # The "no C libraries, no runtime install" invariant, checked against
        # the shipped bytes rather than against the build flags that are
        # supposed to produce them. Reading CGO_ENABLED=0 out of the config
        # would prove only that the config still says what it said.
        #
        # The check is per-platform because the ground truth is per-platform, and
        # getting this wrong is not hypothetical: an earlier version ran `ldd` on
        # darwin as well as linux, and macOS has no `ldd`, so the darwin leg
        # failed on a tool that does not exist there.
        #
        #   linux   -- `ldd` is definitive. A dynamically linked binary prints its
        #              loader and libc; a static one prints "not a dynamic
        #              executable".
        #   darwin  -- `otool -L`. A CGO_ENABLED=0 Go binary links only the
        #              system library; a cgo one drags in a dylib from wherever
        #              it was built, which is the failure being guarded against.
        #   windows -- no equivalent worth faking, so the leg is skipped and
        #              says so. The CGO_ENABLED=0 claim is carried by the other
        #              two legs and by the config itself.
        run: |
          set -euo pipefail

          case "$GOOS" in
            windows)
              # Exits before any lookup, deliberately. An earlier version located
              # the binary with `find -name 'tantu'` before branching, and on
              # windows the binary is `tantu.exe`, so the lookup found nothing and
              # the leg failed with "no binary found under unpacked/" on a step
              # that was going to skip anyway.
              echo "windows has no ldd or otool equivalent; the static-linking claim is checked on the linux and darwin legs"
              exit 0
              ;;
          esac

          # ${EXT} rather than a bare name, and not just for tidiness: the
          # windows archive is the one that has a suffix, so a hardcoded name is
          # exactly the case that breaks.
          bin=$(find unpacked -maxdepth 1 -name "tantu${EXT}" -type f | head -1)
          if [ -z "$bin" ]; then
            echo "::error::no binary found under unpacked/ as tantu${EXT}; the archive was empty or packed it under a subdirectory."
            find unpacked -type f
            exit 1
          fi

          case "$GOOS" in
            linux)
              echo "::group::ldd $bin"
              ldd_out=$(ldd "$bin" 2>&1) || true
              echo "$ldd_out"
              echo "::endgroup::"
              # An absent or broken ldd must not read as "statically linked".
              # Both a static binary and a missing ldd produce no libc line, so
              # the absence of evidence is checked for explicitly -- otherwise the
              # gate passes having proved nothing, which is worse than not
              # having it. This branch is what the darwin failure tripped.
              case "$ldd_out" in
                *"not a dynamic executable"*) ;;
                "") echo "::error::ldd produced no output for $bin. The static-linking check would pass without having run, so this proves nothing."; exit 1 ;;
                *"not found"*) echo "::error::ldd is not available on this runner, so the static-linking check cannot run."; exit 1 ;;
              esac
              if printf '%s' "$ldd_out" | grep -qE 'libc\.so|GLIBC_'; then
                echo "::error::$bin is dynamically linked. It will not run on a machine without a matching libc, which is the whole premise of shipping a static binary."
                exit 1
              fi
              echo "OK: $bin is statically linked"
              ;;
            darwin)
              echo "::group::otool -L $bin"
              otool_out=$(otool -L "$bin" 2>&1) || true
              echo "$otool_out"
              echo "::endgroup::"
              case "$otool_out" in
                "") echo "::error::otool produced no output for $bin; the check would pass without having run."; exit 1 ;;
                *"command not found"*|*"error:"|*"can't open"*) echo "::error::otool could not read $bin, so the static-linking check cannot run."; exit 1 ;;
              esac
              # Line 1 is the binary itself; the rest are linked libraries. Only
              # paths inside /usr/lib or /System are present on every macOS, so
              # anything else -- @rpath, /usr/local, /opt/homebrew -- means a
              # dylib from the build machine that a user will not have.
              libs=$(printf '%s\n' "$otool_out" | tail -n +2 | sed 's/^[[:space:]]*//; s/[[:space:]].*$//' | grep -v '^$' || true)
              echo "linked libraries:"
              printf '  %s\n' $libs
              if [ -z "$libs" ]; then
                echo "::error::otool listed no libraries at all; refusing to call that statically linked without evidence."
                exit 1
              fi
              offenders=$(printf '%s\n' $libs | grep -vE '^(/usr/lib/|/System/)' || true)
              if [ -n "$offenders" ]; then
                echo "::error::$bin links libraries from outside the macOS system tree. A user without them cannot run it:"
                printf '  %s\n' $offenders
                exit 1
              fi
              echo "OK: $bin links only macOS system libraries"
              ;;
            *)
              echo "::error::no static-linking check defined for GOOS=$GOOS"
              exit 1
              ;;
          esac
