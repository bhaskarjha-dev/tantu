# staticcheck configuration
#
# The CI gate runs `staticcheck ./...`. This file records the checks that are
# deliberately not enforced, and why, so the gate can be green honestly rather
# than by deleting correct code.
#
# Checks NOT disabled here are the ones that caught real defects in this
# repository: SA4000 (a test compared a value with itself and could never
# fail), U1000 (dead security helpers left behind by a refactor), and ST1018
# (the invisible soft hyphen left behind by the encoding damage).
#
# "inherit" keeps staticcheck's own default check selection. Writing an
# explicit list here would replace it, which silently turns on the whole
# style-check family (ST1000 package comments, ST1020 comment form) and
# makes the gate red for reasons that are taste, not correctness.
checks = ["inherit", "-ST1005"]

# Why ST1005 is off: error strings should not be capitalized. Tantu
# capitalizes "Hub", "Tantu" and "OAuth" because they are proper nouns naming
# the product, not sentence starts. Lower-casing them would be wrong in
# English, and these strings are diagnostic text shown to the user, where
# sentence-style capitalization is correct. The dashboard uses the same names,
# so the CLI has to match it.
